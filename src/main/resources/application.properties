# ===== SERVER =====
server.port=${PORT:8080}

# ===== DATABASE — Supabase Postgres =====
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HIKARICP (connection pool) =====
# Secondary tuning, NOT the main speed fix (that's pagination + batch queries in
# the service/controller layer). This just makes connection usage efficient and
# fails fast instead of hanging, which matters on Render free tier + Supabase
# Supavisor pooled connections (port 5432, session mode).
#   maximum-pool-size: keep small -- Render free tier is 512MB RAM and Supabase's
#                      pooler has its own connection cap shared across projects.
#   minimum-idle:      keep 2 warm so a request right after a cold start doesn't
#                      also pay full connection-establishment latency.
#   connection-timeout: fail fast (10s) instead of queueing requests forever if
#                      the pool is exhausted.
#   idle-timeout / max-lifetime: recycle connections periodically so Supabase's
#                      pooler doesn't kill stale ones out from under us.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1700000

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===== ADMIN CREDENTIALS =====
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:stylista@2025}
app.admin.token-secret=${ADMIN_TOKEN_SECRET:stylista-secret-change-me}

# ===== CASHBACK DEFAULTS =====
app.cashback.default-percent=20
app.cashback.default-expiry-days=60

# ===== NOTIFICATIONS (off for now) =====
app.notifications.enabled=${NOTIFICATIONS_ENABLED:false}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ORIGINS:https://stylistaboutique.com,https://www.stylistaboutique.com,http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500}